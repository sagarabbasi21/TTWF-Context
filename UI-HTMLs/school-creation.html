<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Create New School - School Management</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#7BAFDE",
                        secondary: "#1A7F87",
                        "background-light": "#F8FAFC",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="schools" data-title="Create New School" data-desc="Register a new school into the system." class="bg-background-light text-slate-800 min-h-screen flex font-display">
    <div id="sidebar"></div>
    <main class="flex-1 flex flex-col min-w-0">
        <!-- Top Action Bar -->
        <div class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-end gap-3">
            <button
                class="px-6 py-2 rounded border border-gray-300 text-slate-600 text-xs font-bold tracking-widest hover:bg-slate-50 transition-colors"
                type="button">
                Cancel
            </button>
            <button
                class="px-6 py-2 rounded bg-primary text-white text-xs font-bold tracking-widest hover:bg-secondary shadow-sm transition-colors flex items-center gap-2"
                type="submit" form="schoolForm">
                <span class="material-symbols-outlined text-sm">save</span>
                Save School
            </button>
        </div>

        <div class="p-8 w-full">
            <form id="schoolForm" class="space-y-6">

                <!-- Hierarchy Selection -->
                <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                    <div class="bg-primary text-white px-6 py-3 flex items-center gap-2 rounded-t-lg">
                        <span class="material-symbols-outlined text-lg">account_tree</span>
                        <span class="text-xs font-bold tracking-widest">Hierarchy Selection</span>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">

                            <!-- Country -->
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Country <span
                                        class="text-red-500">*</span></label>
                                <select
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                    <option value="">Select Country</option>
                                    <option>Pakistan</option>
                                </select>
                            </div>

                            <!-- Province -->
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Province <span
                                        class="text-red-500">*</span></label>
                                <select
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                    <option value="">Select Province</option>
                                    <option>Sindh</option>
                                    <option>Punjab</option>
                                    <option>KPK</option>
                                    <option>Balochistan</option>
                                </select>
                            </div>

                            <!-- Region -->
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Region <span
                                        class="text-red-500">*</span></label>
                                <select
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                    <option value="">Select Region</option>
                                    <option>Region A</option>
                                    <option>Region B</option>
                                </select>
                            </div>

                            <!-- Area -->
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Area <span
                                        class="text-red-500">*</span></label>
                                <select
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                    <option value="">Select Area</option>
                                    <option>Area 1</option>
                                    <option>Area 2</option>
                                </select>
                            </div>

                            <!-- Cluster -->
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Cluster <span
                                        class="text-red-500">*</span></label>
                                <select
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                    <option value="">Select Cluster</option>
                                    <option>Cluster Alpha</option>
                                    <option>Cluster Beta</option>
                                </select>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Basic Information -->
                <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                    <div class="bg-primary text-white px-6 py-3 flex items-center gap-2 rounded-t-lg">
                        <span class="material-symbols-outlined text-lg">info</span>
                        <span class="text-xs font-bold tracking-widest">Basic Information</span>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">School ID
                                    <span class="text-slate-400 text-[9px]">(Auto-generated)</span></label>
                                <input
                                    class="w-full rounded border-gray-300 shadow-sm text-xs py-2 px-3 mt-1 bg-slate-100 text-slate-500 cursor-not-allowed"
                                    value="135" type="text" disabled />
                            </div>
                            <div class="lg:col-span-2">
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">School Name <span
                                        class="text-red-500">*</span></label>
                                <input
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1"
                                    placeholder="Enter full school name" type="text" />
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Project</label>
                                <select
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                    <option value="">Select Project</option>
                                    <option>Project Alpha</option>
                                    <option>Project Beta</option>
                                    <option>Sustain Education</option>
                                    <option>Literacy Drive</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">School Type <span
                                        class="text-red-500">*</span></label>
                                <select
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                    <option value="">Select Type</option>
                                    <option>Micro School</option>
                                    <option>Model School</option>
                                    <option>Community School</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">SEF School Code</label>
                                <input
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1"
                                    placeholder="Enter code" type="text" />
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Status <span
                                        class="text-red-500">*</span></label>
                                <select
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                    <option>Active</option>
                                    <option>Pending</option>
                                    <option>Closed</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Operations & Location -->
                <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                    <div class="bg-primary text-white px-6 py-3 flex items-center gap-2 rounded-t-lg">
                        <span class="material-symbols-outlined text-lg">location_on</span>
                        <span class="text-xs font-bold tracking-widest">Operations &amp; Location</span>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">District <span
                                        class="text-red-500">*</span></label>
                                <select
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                    <option value="">Select District</option>
                                    <option>Central</option>
                                    <option>East</option>
                                    <option>South</option>
                                    <option>Lahore</option>
                                    <option>Karachi</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Launch Date <span
                                        class="text-red-500">*</span></label>
                                <input
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1"
                                    type="text" placeholder="dd-mm-yyyy" />
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Closure Date</label>
                                <input
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1"
                                    type="text" placeholder="dd-mm-yyyy" />
                            </div>
                            <div class="lg:col-span-1">
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Google Map Location
                                    (Url) <span class="text-red-500">*</span></label>
                                <input
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1"
                                    placeholder="https://maps.google.com/..." type="url" />
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Longitude <span
                                        class="text-red-500">*</span></label>
                                <input
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1"
                                    placeholder="e.g. 67.0011" type="text" />
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Latitude <span
                                        class="text-red-500">*</span></label>
                                <input
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1"
                                    placeholder="e.g. 24.8607" type="text" />
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Shifts & Devices -->
                <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                    <div class="bg-primary text-white px-6 py-3 flex items-center gap-2 rounded-t-lg">
                        <span class="material-symbols-outlined text-lg">schedule</span>
                        <span class="text-xs font-bold tracking-widest">Shifts &amp; Devices</span>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Devices <span
                                        class="text-red-500">*</span></label>
                                <input
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1"
                                    value="26" type="number" />
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 tracking-wider">Shifts <span
                                        class="text-red-500">*</span></label>
                                <input
                                    class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1"
                                    value="4" type="number" />
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Working Days -->
                <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                    <div class="bg-primary text-white px-6 py-3 flex items-center gap-2 rounded-t-lg">
                        <span class="material-symbols-outlined text-lg">calendar_month</span>
                        <span class="text-xs font-bold tracking-widest">Working Days</span>
                    </div>
                    <div class="p-6">
                        <div class="flex flex-wrap gap-4">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" checked class="rounded border-gray-300 text-primary focus:ring-primary focus:ring-opacity-50" />
                                <span class="text-xs font-medium text-slate-700">Monday</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" checked class="rounded border-gray-300 text-primary focus:ring-primary focus:ring-opacity-50" />
                                <span class="text-xs font-medium text-slate-700">Tuesday</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" checked class="rounded border-gray-300 text-primary focus:ring-primary focus:ring-opacity-50" />
                                <span class="text-xs font-medium text-slate-700">Wednesday</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" checked class="rounded border-gray-300 text-primary focus:ring-primary focus:ring-opacity-50" />
                                <span class="text-xs font-medium text-slate-700">Thursday</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" checked class="rounded border-gray-300 text-primary focus:ring-primary focus:ring-opacity-50" />
                                <span class="text-xs font-medium text-slate-700">Friday</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary focus:ring-opacity-50" />
                                <span class="text-xs font-medium text-slate-700">Saturday</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary focus:ring-opacity-50" />
                                <span class="text-xs font-medium text-slate-700">Sunday</span>
                            </label>
                        </div>
                    </div>
                </div>

            </form>
        </div>
    </main>
    <script src="layout.js"></script>
</body>

</html>
