<!DOCTYPE html>

<html class="light" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Shift Management - Teach The World</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#7cafde",
            "background-light": "#f6f7f8",
            "background-dark": "#13191f",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="schools" data-title="Shifts" data-desc="Manage school shift timings and schedules."
  class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
  <div x-data="{ shiftModalOpen:false }" class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div id="sidebar"></div>
    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <!-- Top Bar -->

      <!-- Scrollable Content -->
      <main class="flex-1 overflow-y-auto p-8">
        <div class="max-w-6xl mx-auto space-y-6">
          <!-- Title & Action Bar -->
          <div class="flex flex-col md:flex-row md:items-center justify-end gap-4">
            <button @click="shiftModalOpen = true"
              class="inline-flex items-center justify-center gap-2 px-6 py-2.5 bg-primary text-white rounded-lg hover:bg-primary/90 transition-shadow shadow-md font-bold text-sm">
              <span class="material-symbols-outlined text-[20px]">add</span>
              Add Shift
            </button>
          </div>
          <!-- Search Filter -->
          <div
            class="bg-white dark:bg-slate-900 p-2 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <span
                  class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">search</span>
              </div>
              <input
                class="block w-full pl-12 pr-4 py-3 bg-slate-50 dark:bg-slate-800/50 border-transparent focus:border-primary focus:ring-primary/20 rounded-lg text-sm placeholder:text-slate-400 dark:placeholder:text-slate-500"
                placeholder="Search by Shift name, ID ..." type="text" />
            </div>
          </div>
          <!-- Data Table Section -->
          <div
            class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-primary text-white">
                    <th class="px-6 py-4 text-xs font-bold tracking-wider">Shift ID</th>
                    <th class="px-6 py-4 text-xs font-bold tracking-wider">Shift Name</th>
                    <th class="px-6 py-4 text-xs font-bold tracking-wider">Start Time</th>
                    <th class="px-6 py-4 text-xs font-bold tracking-wider">End Time</th>
                    <th class="px-6 py-4 text-xs font-bold tracking-wider text-right">Actions</th>
                  </tr>
                </thead>

                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  <!-- Shift 1 -->
                  <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-500 dark:text-slate-400">
                      SHIFT-001</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-slate-900 dark:text-white">Shift 1
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-700 dark:text-slate-300">08:00 AM</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-700 dark:text-slate-300">10:00 AM</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right">
                      <div class="flex items-center justify-center gap-3">
                        <button
                          class="p-1.5 text-slate-400 hover:text-primary transition-colors rounded-md hover:bg-primary/5"
                          title="Edit">
                          <span class="material-symbols-outlined text-[20px]">edit</span>
                        </button>
                        <button
                          class="p-1.5 text-slate-400 hover:text-red-500 transition-colors rounded-md hover:bg-red-50"
                          title="Delete">
                          <span class="material-symbols-outlined text-[20px]">delete</span>
                        </button>
                      </div>
                    </td>
                  </tr>

                  <!-- Shift 2 -->
                  <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-500 dark:text-slate-400">
                      SHIFT-002</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-slate-900 dark:text-white">Shift 2
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-700 dark:text-slate-300">10:00 AM</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-700 dark:text-slate-300">12:00 PM</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right">
                      <div class="flex items-center justify-center gap-3">
                        <button
                          class="p-1.5 text-slate-400 hover:text-primary transition-colors rounded-md hover:bg-primary/5"
                          title="Edit">
                          <span class="material-symbols-outlined text-[20px]">edit</span>
                        </button>
                        <button
                          class="p-1.5 text-slate-400 hover:text-red-500 transition-colors rounded-md hover:bg-red-50"
                          title="Delete">
                          <span class="material-symbols-outlined text-[20px]">delete</span>
                        </button>
                      </div>
                    </td>
                  </tr>

                  <!-- Shift 3 -->
                  <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-500 dark:text-slate-400">
                      SHIFT-003</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-slate-900 dark:text-white">Shift 3
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-700 dark:text-slate-300">01:00 PM</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-700 dark:text-slate-300">03:00 PM</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right">
                      <div class="flex items-center justify-center gap-3">
                        <button
                          class="p-1.5 text-slate-400 hover:text-primary transition-colors rounded-md hover:bg-primary/5"
                          title="Edit">
                          <span class="material-symbols-outlined text-[20px]">edit</span>
                        </button>
                        <button
                          class="p-1.5 text-slate-400 hover:text-red-500 transition-colors rounded-md hover:bg-red-50"
                          title="Delete">
                          <span class="material-symbols-outlined text-[20px]">delete</span>
                        </button>
                      </div>
                    </td>
                  </tr>

                  <!-- Shift 4 -->
                  <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-500 dark:text-slate-400">
                      SHIFT-004</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-slate-900 dark:text-white">Shift 4
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-700 dark:text-slate-300">03:00 PM</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-700 dark:text-slate-300">05:00 PM</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right">
                      <div class="flex items-center justify-center gap-3">
                        <button
                          class="p-1.5 text-slate-400 hover:text-primary transition-colors rounded-md hover:bg-primary/5"
                          title="Edit">
                          <span class="material-symbols-outlined text-[20px]">edit</span>
                        </button>
                        <button
                          class="p-1.5 text-slate-400 hover:text-red-500 transition-colors rounded-md hover:bg-red-50"
                          title="Delete">
                          <span class="material-symbols-outlined text-[20px]">delete</span>
                        </button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <!-- Pagination Footer -->
            <div class="px-6 py-4 border-t border-slate-100 dark:divide-slate-800 flex items-center justify-between">
              <p class="text-sm text-slate-500">Showing 1 to 4 of 4 Shifts</p>
              <div class="flex gap-2">
                <button
                  class="px-3 py-1 border border-slate-200 dark:border-slate-700 rounded-md text-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors disabled:opacity-50"
                  disabled="">Previous</button>
                <button class="px-3 py-1 bg-primary text-white rounded-md text-sm font-medium">1</button>
                <!-- <button
                                    class="px-3 py-1 border border-slate-200 dark:border-slate-700 rounded-md text-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">2</button> -->
                <button
                  class="px-3 py-1 border border-slate-200 dark:border-slate-700 rounded-md text-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">Next</button>
              </div>
            </div>
          </div>
        </div>
      </main>
      <!-- Modal Overlay -->
      <div x-show="shiftModalOpen" x-transition.opacity @keydown.escape.window="shiftModalOpen = false"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" style="display:none;"
        @click.self="shiftModalOpen = false">
        <!-- Modal Card -->
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95"
          x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-150"
          x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
          class="bg-white rounded-xl shadow-2xl w-full max-w-2xl px-10 py-8 relative">

          <!-- Title -->
          <h2 class="text-lg font-semibold text-slate-800">
            Add New Shift
          </h2>

          <!-- Close -->
          <button @click="shiftModalOpen = false"
            class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 transition-colors" aria-label="Close">
            <span class="material-symbols-outlined text-xl">close</span>
          </button>

          <!-- Form -->
          <div class="mt-8 space-y-5">

            <!-- Shift Number -->
            <div>
              <label class="block text-sm font-semibold text-slate-600 mb-2">Shift Number</label>
              <input type="number" min="1" value="1" class="w-full border border-slate-200 rounded-lg px-4 py-3 text-sm
                   focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all" />
            </div>

            <!-- Shift Start Time -->
            <div>
              <label class="block text-sm font-semibold text-slate-600 mb-2">
                Shift's Start Time
              </label>
              <input type="time" step="60" class="w-full border border-slate-200 rounded-lg px-4 py-3 text-sm
           focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all" />
            </div>

            <!-- Shift End Time -->
            <div>
              <label class="block text-sm font-semibold text-slate-600 mb-2">
                Shift's End Time
              </label>
              <input type="time" step="60" class="w-full border border-slate-200 rounded-lg px-4 py-3 text-sm
           focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all" />
            </div>

            <!-- Action Buttons -->
            <div class="pt-4 flex items-center gap-3">
              <button class="bg-primary text-white px-8 py-2.5 rounded-lg text-sm font-bold
                   shadow-lg shadow-primary/20 hover:opacity-90 transition-all">
                Save
              </button>
              <button @click="shiftModalOpen = false" type="button" class="px-8 py-2.5 rounded-lg text-sm font-bold text-slate-600 border border-slate-200 hover:bg-slate-50 transition-all">
                Cancel
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="layout.js"></script>
</body>

</html>
