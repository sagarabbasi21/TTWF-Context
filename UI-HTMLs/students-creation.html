<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Create New Student - Teach The World Foundation</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#7BAFDE",
                        "background-light": "#F8FAFC",
                        "background-dark": "#0F172A",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                    },
                },
            },
        };
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body data-page="students" data-title="Create New Student" data-desc="Complete the form below to register a new student."
    class="bg-background-light text-slate-800 min-h-screen flex font-display">
    <div id="sidebar"></div>
    <main class="flex-1 flex flex-col h-screen overflow-hidden">

        <!-- Top Action Bar -->
        <div class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-end gap-3">
            <button
                class="px-6 py-2 rounded border border-gray-300 text-slate-600 text-xs font-bold tracking-widest hover:bg-slate-50 transition-colors"
                type="button">
                Cancel
            </button>
            <button
                class="px-6 py-2 rounded bg-primary text-white text-xs font-bold tracking-widest hover:bg-sky-500 shadow-sm transition-colors flex items-center gap-2"
                type="submit" form="studentForm">
                <span class="material-symbols-outlined text-sm">save</span>
                Save Student
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="w-full">
                <form id="studentForm" class="space-y-6">

                    <!-- Hierarchy Selection -->
                    <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                        <div class="bg-primary text-white px-6 py-3 flex items-center gap-2 rounded-t-lg">
                            <span class="material-symbols-outlined text-lg">account_tree</span>
                            <span class="text-xs font-bold tracking-widest">Hierarchy Selection</span>
                        </div>
                        <div class="p-6">
                            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">

                                <!-- Country -->
                                <div>
                                    <label class="text-[10px] font-bold text-slate-500 tracking-wider">Country <span
                                            class="text-red-500">*</span></label>
                                    <select
                                        class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                        <option value="">Select Country</option>
                                        <option>Pakistan</option>
                                    </select>
                                </div>

                                <!-- Province -->
                                <div>
                                    <label class="text-[10px] font-bold text-slate-500 tracking-wider">Province <span
                                            class="text-red-500">*</span></label>
                                    <select
                                        class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                        <option value="">Select Province</option>
                                        <option>Sindh</option>
                                        <option>Punjab</option>
                                        <option>KPK</option>
                                        <option>Balochistan</option>
                                    </select>
                                </div>

                                <!-- District -->
                                <div>
                                    <label class="text-[10px] font-bold text-slate-500 tracking-wider">District <span
                                            class="text-red-500">*</span></label>
                                    <select
                                        class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                        <option value="">Select District</option>
                                        <option>Central</option>
                                        <option>East</option>
                                        <option>South</option>
                                    </select>
                                </div>

                                <!-- Region -->
                                <div>
                                    <label class="text-[10px] font-bold text-slate-500 tracking-wider">Region <span
                                            class="text-red-500">*</span></label>
                                    <select
                                        class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                        <option value="">Select Region</option>
                                        <option>Region A</option>
                                        <option>Region B</option>
                                    </select>
                                </div>

                                <!-- Area -->
                                <div>
                                    <label class="text-[10px] font-bold text-slate-500 tracking-wider">Area <span
                                            class="text-red-500">*</span></label>
                                    <select
                                        class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                        <option value="">Select Area</option>
                                        <option>Area 1</option>
                                        <option>Area 2</option>
                                    </select>
                                </div>

                                <!-- Cluster -->
                                <div>
                                    <label class="text-[10px] font-bold text-slate-500 tracking-wider">Cluster <span
                                            class="text-red-500">*</span></label>
                                    <select
                                        class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                        <option value="">Select Cluster</option>
                                        <option>Cluster Alpha</option>
                                        <option>Cluster Beta</option>
                                    </select>
                                </div>

                                <!-- School -->
                                <div>
                                    <label class="text-[10px] font-bold text-slate-500 tracking-wider">School <span
                                            class="text-red-500">*</span></label>
                                    <select
                                        class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                        <option value="">Select School</option>
                                        <option>School 1</option>
                                        <option>School 2</option>
                                    </select>
                                </div>

                            </div>
                        </div>
                    </div>

                    <!-- Basic Information -->
                    <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                        <div class="bg-primary text-white px-6 py-3 flex items-center gap-2 rounded-t-lg">
                            <span class="material-symbols-outlined text-lg">info</span>
                            <span class="text-xs font-bold tracking-widest">Basic Information</span>
                        </div>
                        <div class="p-6">
                            <div class="flex flex-col md:flex-row gap-12">
                                <!-- Profile Image Upload -->
                                <div class="flex flex-col items-center gap-4 shrink-0">
                                    <div class="relative group">
                                        <div
                                            class="w-32 h-32 rounded-full border-4 border-slate-100 bg-slate-50 flex items-center justify-center overflow-hidden">
                                            <span
                                                class="material-icons-outlined text-slate-300 text-5xl group-hover:opacity-0 transition-opacity">person</span>
                                            <div
                                                class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center text-white cursor-pointer">
                                                <span class="material-icons-outlined">photo_camera</span>
                                                <span class="text-[10px] font-medium">Upload</span>
                                            </div>
                                        </div>
                                        <div
                                            class="absolute bottom-0 right-0 w-8 h-8 bg-primary rounded-full flex items-center justify-center text-white border-2 border-white">
                                            <span class="material-icons-outlined text-sm">add</span>
                                        </div>
                                    </div>
                                    <div class="text-center">
                                        <p class="text-xs font-medium text-slate-700">Profile Image</p>
                                        <p class="text-[10px] text-slate-400">JPG or PNG, max 2MB</p>
                                    </div>
                                </div>

                                <!-- Form Fields -->
                                <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label class="text-[10px] font-bold text-slate-500 tracking-wider">Student UID
                                            <span class="text-slate-400 text-[9px]">(Auto-generated)</span></label>
                                        <input
                                            class="w-full rounded border-gray-300 shadow-sm text-xs py-2 px-3 mt-1 bg-slate-100 text-slate-500 cursor-not-allowed"
                                            type="text" id="student-unid" value="135005" disabled />
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-bold text-slate-500 tracking-wider">Student
                                            Name <span class="text-red-500">*</span></label>
                                        <input
                                            class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1"
                                            placeholder="Enter student's full name" type="text" />
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-bold text-slate-500 tracking-wider">Date Of
                                            Birth <span class="text-red-500">*</span></label>
                                        <input
                                            class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1"
                                            type="text" placeholder="dd-mm-yyyy" />
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-bold text-slate-500 tracking-wider">Admission Date <span
                                                class="text-red-500">*</span></label>
                                        <input
                                            class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1"
                                            type="text" placeholder="dd-mm-yyyy" />
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-bold text-slate-500 tracking-wider">Gender <span
                                                class="text-red-500">*</span></label>
                                        <select
                                            class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                            <option value="">Select Gender</option>
                                            <option value="male">Male</option>
                                            <option value="female">Female</option>
                                            <option value="other">Other</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-bold text-slate-500 tracking-wider">Shift <span
                                                class="text-red-500">*</span></label>
                                        <select
                                            class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                            <option value="">Select Shift</option>
                                            <option value="morning">Shift 1  08:00 AM – 10:00 AM</option>
                                            <option value="afternoon">Shift 2 10:00 AM – 12:00 PM</option>
                                            <option value="evening">Shift 3 01:00 PM – 03:00 PM</option>
                                            <option value="evening">Shift 4 03:00 PM – 05:00 PM</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-bold text-slate-500 tracking-wider">Assigned
                                            Device <span class="text-red-500">*</span></label>
                                        <select
                                            class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 text-xs py-2 px-3 mt-1">
                                            <option value="">Select Vacant Device (based on shift)</option>
                                            <option value="d-101">Device - 101 (Vacant)</option>
                                            <option value="d-102">Device - 102 (Vacant)</option>
                                        </select>
                                    </div>
                                    <div class="flex flex-col justify-center">
                                        <label class="text-[10px] font-bold text-slate-500 tracking-wider">Status</label>
                                        <label class="flex items-center gap-3 cursor-pointer select-none mt-1">
                                            <div class="relative">
                                                <input type="checkbox" id="activeToggle" class="sr-only peer" checked />
                                                <div class="w-10 h-5 bg-slate-200 peer-checked:bg-primary rounded-full transition-colors"></div>
                                                <div class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform peer-checked:translate-x-5"></div>
                                            </div>
                                            <span id="activeToggleLabel" class="text-xs font-semibold text-primary">Active</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Inactive Reason (hidden by default) -->
                    <div id="inactiveReasonBlock" class="hidden p-4 bg-amber-50 border border-amber-200 rounded-lg">
                        <label class="block text-[10px] font-bold text-amber-700 tracking-wider mb-2">
                            <span class="material-symbols-outlined text-sm align-middle mr-1">warning</span>
                            Reason For Inactive Status <span class="text-red-500">*</span>
                        </label>
                        <select id="inactiveReason"
                            class="w-full rounded border-amber-300 shadow-sm focus:border-amber-400 focus:ring focus:ring-amber-400 focus:ring-opacity-50 text-xs py-2 px-3">
                            <option value="">Select a reason...</option>
                            <option value="dropped_out">Dropped Out</option>
                            <option value="transferred">Transferred to Another School</option>
                            <option value="family_relocation">Family Relocation</option>
                            <option value="health_issues">Health Issues</option>
                            <option value="financial_constraints">Financial Constraints</option>
                            <option value="completed">Completed Programme</option>
                            <option value="other">Other</option>
                        </select>
                        <div id="inactiveReasonOther" class="hidden mt-3">
                            <input type="text"
                                class="w-full rounded border-amber-300 shadow-sm focus:border-amber-400 focus:ring focus:ring-amber-400 focus:ring-opacity-50 text-xs py-2 px-3"
                                placeholder="Please specify the reason..." />
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </main>
    <script src="layout.js"></script>
    <script>
        var activeToggle = document.getElementById('activeToggle');
        var activeLabel = document.getElementById('activeToggleLabel');
        var inactiveBlock = document.getElementById('inactiveReasonBlock');
        var inactiveReason = document.getElementById('inactiveReason');
        var inactiveOther = document.getElementById('inactiveReasonOther');

        activeToggle.addEventListener('change', function() {
            if (this.checked) {
                activeLabel.textContent = 'Active';
                activeLabel.className = 'text-xs font-semibold text-primary';
                inactiveBlock.classList.add('hidden');
                inactiveReason.value = '';
            } else {
                activeLabel.textContent = 'Inactive';
                activeLabel.className = 'text-xs font-semibold text-amber-600';
                inactiveBlock.classList.remove('hidden');
            }
        });

        inactiveReason.addEventListener('change', function() {
            if (this.value === 'other') {
                inactiveOther.classList.remove('hidden');
            } else {
                inactiveOther.classList.add('hidden');
            }
        });
    </script>
</body>

</html>
