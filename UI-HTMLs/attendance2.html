<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Attendance State - Teach The World</title>
     <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
    rel="stylesheet" />
        <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
     <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#7BAFDE", // Teal color from the screenshot
            "background-light": "#F8FAFB",
            "background-dark": "#111827",
            "sidebar-light": "#FFFFFF",
            "sidebar-dark": "#1F2937",
          },
          fontFamily: {
            display: ["Inter", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "8px",
          },
        },
      },
    };
  </script>

</head>

<body data-page="attendance" data-title="Attendance Overview" data-desc="Select a school and month to view attendance records." class="bg-background-light dark:bg-background-dark min-h-screen flex text-slate-800 dark:text-slate-100">
   <div id="sidebar"></div>
  <main class="flex-1 flex flex-col">

    <div class="p-8 max-w-7xl mx-auto w-full">
      <div class="mb-8">
        <h2 class="text-3xl font-bold text-primary dark:text-teal-400 mb-8 max-w-2xl leading-tight">
          Select a specific school and month to view Attendance
        </h2>
        <div class="flex flex-wrap items-center justify-between gap-6">
          <div class="flex flex-wrap items-center gap-4">
            <div
              class="flex border border-slate-200 dark:border-slate-600 rounded-lg overflow-hidden bg-white dark:bg-slate-800">
              <button class="px-6 py-2.5 bg-primary text-white font-medium">Month</button>
              <button
                class="px-6 py-2.5 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700 font-medium">Date
                Range</button>
            </div>
            <div class="relative group">
              <button
                class="flex items-center gap-4 px-5 py-2.5 bg-primary text-white rounded-lg font-medium transition-all min-w-[180px] justify-between">
                <span>Select School</span>
                <span class="material-icons-outlined text-sm">expand_more</span>
              </button>
            </div>
            <div class="relative group">
              <button
                class="flex items-center gap-4 px-5 py-2.5 border-2 border-slate-200 dark:border-slate-600 text-slate-400 dark:text-slate-500 bg-white dark:bg-slate-800 rounded-lg font-medium min-w-[180px] justify-between">
                <span>Select Month</span>
                <span class="material-icons-outlined text-sm">expand_more</span>
              </button>
            </div>
          </div>
          <div class="flex items-center">
            <input
              class="h-[46px] border border-slate-200 dark:border-slate-600 border-r-0 rounded-l-lg px-4 bg-white dark:bg-slate-800 focus:outline-none focus:ring-0 w-64 text-slate-600 dark:text-slate-300"
              placeholder="Search Student" type="text" />
            <button class="h-[46px] px-4 bg-primary text-white rounded-r-lg hover:bg-teal-800 transition-colors">
              <span class="material-icons-outlined">search</span>
            </button>
          </div>
        </div>
      </div>
      <div class="mt-20 flex justify-center">
        <div
          class="bg-white dark:bg-slate-800 p-12 rounded-3xl custom-shadow max-w-xl w-full text-center border border-slate-100 dark:border-slate-700 relative overflow-hidden">
          <div
            class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-48 bg-primary/5 rounded-full blur-3xl -translate-y-1/2">
          </div>
          <div class="relative mb-8 flex justify-center">
            <div
              class="w-24 h-24 bg-amber-400 rounded-2xl flex items-center justify-center shadow-lg relative overflow-hidden">
              <div class="absolute inset-0 bg-white/20 -rotate-45 translate-y-12"></div>
              <div class="bg-white rounded-sm w-12 h-16 p-2 flex flex-col gap-1.5 shadow-sm">
                <div class="flex items-center gap-1">
                  <div class="w-1 h-1 bg-blue-500 rounded-full"></div>
                  <div class="w-full h-[2px] bg-slate-200 rounded-full"></div>
                </div>
                <div class="flex items-center gap-1">
                  <div class="w-1 h-1 bg-green-500 rounded-full"></div>
                  <div class="w-full h-[2px] bg-slate-200 rounded-full"></div>
                </div>
                <div class="flex items-center gap-1">
                  <div class="w-1 h-1 bg-amber-500 rounded-full"></div>
                  <div class="w-full h-[2px] bg-slate-200 rounded-full"></div>
                </div>
                <div class="flex items-center gap-1">
                  <div class="w-1 h-1 bg-red-500 rounded-full"></div>
                  <div class="w-full h-[2px] bg-slate-200 rounded-full"></div>
                </div>
              </div>
              <div class="absolute bottom-2 right-4 w-12 h-1 bg-green-400 rotate-[45deg] origin-left rounded-full">
              </div>
            </div>
          </div>
          <h3 class="text-xl lg:text-2xl font-semibold text-primary dark:text-teal-400 mb-2">
            All Schools Attendance Average
          </h3>
          <div class="text-6xl lg:text-7xl font-bold text-red-500 mb-4 tracking-tighter">
            0%
          </div>
          <p class="text-slate-400 dark:text-slate-500 text-sm max-w-xs mx-auto">
            Please select a school and a month to view the detailed attendance report.
          </p>
        </div>
      </div>
    </div>
  </main>
  <button
    class="fixed bottom-6 right-6 p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full shadow-lg text-slate-600 dark:text-slate-300 hover:scale-110 transition-transform"
    onclick="document.documentElement.classList.toggle('dark')">
    <span class="material-icons-outlined">dark_mode</span>
  </button>
 <script src="layout.js"></script>
</body>

</html>
