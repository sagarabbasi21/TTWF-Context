<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Forgot Password - Teach The World</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#7BAFDE",
                        "brand-teal": "#0D5257",
                        "off-white": "#F8F9FA",
                    },
                    fontFamily: {
                        display: ["Outfit", "sans-serif"],
                        sans: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "12px",
                    },
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        :root {
            --primary-color: #7BAFDE;
        }
        .card-elevated {
            background: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .dark .card-elevated {
            background: #1e293b;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body class="bg-off-white dark:bg-slate-900 min-h-screen flex flex-col font-sans transition-colors duration-300">
    <main class="flex-grow flex flex-col items-center justify-center px-6 py-12">
     <header class="w-full py-12 flex items-center justify-center gap-6">
    
    <img 
        src="/images/teach-the-world.webp" 
        alt="Teach The World Logo"
        class="w-48 md:w-56 lg:w-64 h-auto mb-4 object-contain"
    />


</header>
        <div
            class="card-elevated w-full max-w-lg rounded-2xl p-8 md:p-10 border border-slate-100 dark:border-slate-800">
            <div class="mb-8">
                <h2 class="font-display text-3xl font-bold text-[#1A497F] dark:text-white mb-4">
                    Forgot Password
                </h2>
                <p class="text-slate-600 dark:text-slate-400 leading-relaxed">
                    A link will be sent to your email. Please click that link to Reset your password. Make sure you
                    enter the correct email below.
                </p>
            </div>
            <form action="#" class="space-y-6" method="POST">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2" for="email">
                        Enter your email
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-slate-400 text-lg">mail</span>
                        </div>
                        <input
                            class="block w-full pl-10 pr-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary dark:text-white text-slate-900 transition-all placeholder:text-slate-400"
                            id="email" name="email" placeholder="email@example.com" required="" type="email" />
                    </div>
                </div>
                <div class="flex flex-col sm:flex-row items-center justify-between gap-6 pt-4">
                    <button
                        class="w-full sm:w-auto px-8 py-3 bg-[#7BAFDE] hover:bg-[#6ba0cf] text-white font-bold rounded-xl shadow-lg shadow-[#7BAFDE]/20 transition-all transform hover:-translate-y-0.5 active:translate-y-0"
                        type="submit">
                        Reset Password
                    </button>
                    <a class="flex items-center gap-1 text-slate-500 dark:text-slate-400 font-medium hover:text-brand-teal dark:hover:text-primary transition-colors"
                        href="login.html">
                        <span class="text-sm">Back to</span>
                        <span class="font-bold underline underline-offset-4">Login</span>
                    </a>
                </div>
            </form>
        </div>
    </main>

</body>

</html>
